name: Deploy

on:
  push:
    branches:
      - new-dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/project-management
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Push Docker images
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull $IMAGE_NAME:$IMAGE_TAG

            docker stop project-management || true
            docker rm project-management || true

            docker run -d \
              --restart unless-stopped \
              --env-file /home/ubuntu/.env \
              --name project-management \
              -p 3000:3000 \
              -p 3001:3001 \
              $IMAGE_NAME:$IMAGE_TAG

            docker image prune -f

            docker ps